site_name: combocizes
site_description: "TODO: one-line description of what combocizes does."
site_url: https://caleyest.github.io/combocizes/
repo_url: https://github.com/caleyest/combocizes
repo_name: caleyest/combocizes
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - How-to:
      - Getting started: how-to/getting-started.md
      - Environment setup: how-to/environment-setup.md
      - Running scripts: how-to/running-scripts.md
      - Creating Quarto reports: how-to/creating-quarto-reports.md
  - Reference:
      - Project structure: reference/project-structure.md
      - Exercise data model: reference/exercise-data.md
      - Generator: reference/generator.md
  - Reports: https://caleyest.github.io/combocizes/quarto/report.html

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/caleyest/combocizes
